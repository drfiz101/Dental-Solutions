<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Book an appointment</title>
<meta name="description" content="Book your dental appointment online.">
<meta name="theme-color" content="#0F4F45">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{--ink:#16302B;--muted:#5E716C;--line:#DCE6E3;--bg:#F3F7F6;--surface:#fff;--brand:#0F4F45;--brand2:#14705F;--soft:#E3F2EE;--bad:#A4231B;--warn:#8A5300}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#E7F0EE;--muted:#9DB2AD;--line:#2A3B38;--bg:#0E1716;--surface:#16211F;--brand:#3FB59B;--brand2:#3FB59B;--soft:#1C2E2A;--bad:#F08A80;--warn:#E3B062}}
*{box-sizing:border-box}html,body{margin:0}body{font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 40px}
.hd{display:flex;gap:12px;align-items:center;padding:6px 0 14px}.hd img{width:56px;height:56px;border-radius:14px;object-fit:cover;background:#fff;border:1px solid var(--line)}.hd .ini{width:56px;height:56px;border-radius:14px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:800;font-size:20px}
.hd h1{margin:0;font-size:20px;line-height:1.2}.hd p{margin:2px 0 0;color:var(--muted);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 0 12px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
h2{font-size:15px;margin:0 0 10px;display:flex;gap:8px;align-items:center}h2 .n{width:22px;height:22px;border-radius:50%;background:var(--brand);color:#fff;font-size:12px;display:grid;place-items:center}
.msg{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:14px;margin:0 0 12px}
.days{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scroll-snap-type:x mandatory}.days::-webkit-scrollbar{height:0}
.day{flex:0 0 auto;scroll-snap-align:start;min-width:64px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:8px 6px;text-align:center;font:inherit;cursor:pointer}
.day b{display:block;font-size:18px}.day small{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}.day i{display:block;font-style:normal;font-size:10.5px;color:var(--brand2);margin-top:2px}
.day[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}.day[aria-pressed="true"] small,.day[aria-pressed="true"] i{color:#fff}.day:disabled{opacity:.45;cursor:default}
.times{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.tm{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 4px;font:inherit;font-weight:600;cursor:pointer}.tm[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.tm:disabled{background:var(--bg);color:var(--muted);text-decoration:line-through;font-weight:400;cursor:default}
.none{color:var(--muted);font-size:14px;margin:4px 0}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}textarea{resize:vertical;min-height:64px}
label.dent-lab{font-size:16px;font-weight:700;color:var(--ink);margin-top:14px}
select.dent-pick{border:2px solid var(--brand2);background:var(--soft);font-size:17px;font-weight:700;padding:13px 14px;box-shadow:0 0 0 4px color-mix(in srgb,var(--brand2) 18%,transparent)}
select.dent-pick:focus{outline:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--brand2) 35%,transparent)}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font:inherit;font-weight:700;font-size:16px;background:var(--brand);color:#fff;cursor:pointer;margin-top:14px}.btn:disabled{opacity:.55}
.btn.wa{background:#1FA855}.btn.ghost{background:transparent;color:var(--brand2);border:1px solid var(--line)}
.err{color:var(--bad);font-size:14px;margin:8px 0 0}
.sum{display:flex;gap:10px;align-items:center;background:var(--soft);border-radius:12px;padding:10px 12px;font-size:14px;margin-top:10px}.sum b{font-size:15px}
.ok{text-align:center;padding:22px 14px}.ok .tick{width:64px;height:64px;border-radius:50%;background:#1FA855;color:#fff;font-size:34px;display:grid;place-items:center;margin:0 auto 10px}.ok h2{justify-content:center;font-size:20px}
.ft{color:var(--muted);font-size:12.5px;text-align:center;margin-top:16px}.ft a{color:var(--brand2)}
.load{display:grid;place-items:center;padding:40px;color:var(--muted)}.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin:8px 0 0}.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid var(--line);background:var(--surface)}.legend .b::before{background:var(--bg)}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="load"><div class="spin"></div><p>Loading free times…</p></div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const code=(new URLSearchParams(location.search).get("c")||"alawan").toLowerCase().replace(/[^a-z0-9-]/g,"");
const pad=n=>String(n).padStart(2,"0"),ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const addDays=(s,n)=>{const d=new Date(s+"T00:00:00");d.setDate(d.getDate()+n);return ymd(d)};
const toMin=t=>{const [h,m]=String(t).split(":").map(Number);return h*60+(m||0)},fromMin=m=>pad(Math.floor(m/60))+":"+pad(m%60);
const fmtT=t=>{const [h,m]=t.split(":").map(Number);return (h%12||12)+":"+pad(m)+(h<12?" AM":" PM")};
const dName=s=>new Date(s+"T00:00:00").toLocaleDateString("en-GB",{weekday:"short"}),dLong=s=>new Date(s+"T00:00:00").toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"});
const waNum=p=>{let d=String(p||"").replace(/\D/g,"");if(d.startsWith("0092"))d=d.slice(2);if(d.startsWith("92"))d=d;else if(d.startsWith("0"))d="92"+d.slice(1);else if(d.length===10&&d.startsWith("3"))d="92"+d;return /^923\d{9}$/.test(d)?d:""};
let fs,C=null,HOLDS={},day="",time="",busyTry=0;
function fail(msg){$("app").innerHTML=`<div class="card ok"><h2>${esc(msg)}</h2>${C&&C.phone?`<a class="btn wa" href="https://wa.me/${waNum(C.phone)}">Message us on WhatsApp</a>`:""}</div>`}
async function load(){
  try{firebase.initializeApp(window.FIREBASE_CONFIG);fs=firebase.firestore()}catch(e){}
  try{const s=await fs.collection("publicSlots").doc(code).get();if(!s.exists){fail("Online booking isn't available for this clinic.");return}C=s.data()}catch(e){fail("Couldn't load. Check your internet and try again.");return}
  document.title="Book an appointment · "+(C.name||"Dental clinic");
  if(!C.on){fail("Online booking is closed right now. Please call or WhatsApp the clinic.");return}
  await loadHolds();render()}
async function loadHolds(){HOLDS={};try{const q=await fs.collection("slotHolds").doc(code).collection("h").where("date",">=",ymd(new Date())).get();q.forEach(d=>{const x=d.data();const k=x.date+"_"+x.time.replace(":","");HOLDS[k]=(HOLDS[k]||0)+1})}catch(e){}}
function openDays(){const out=[],t=ymd(new Date()),off=new Set(C.off||[]);for(let i=0;i<=(C.ahead||14);i++){const d=addDays(t,i),wd=new Date(d+"T00:00:00").getDay();if((C.days||[1,2,3,4,5,6]).includes(wd)&&!off.has(d))out.push(d)}return out}
const STEP=()=>Math.max(15,+C.step||60),SUB=()=>Math.max(5,+C.slot||30);
function holdsAt(d,m){let n=0;for(const k in HOLDS){const [hd,ht]=k.split("_");if(hd!==d)continue;const s=toMin(ht.slice(0,2)+":"+ht.slice(2));if(s<=m&&m<s+STEP())n+=HOLDS[k]}return n}
function works(x,d,t){if(!x)return true;const wd=new Date(d+"T00:00:00").getDay(),s0=toMin(t),e0=s0+STEP();return (!x.days||x.days.includes(wd))&&(!x.from||s0>=toMin(x.from))&&(!x.to||e0<=toMin(x.to))}
function dentFree(x,d,t){for(let m=toMin(t);m<toMin(t)+STEP();m+=SUB()){const b=((C.busy||{})[d]||{})[fromMin(m).replace(":","")];if(b&&(b.d||[]).includes(x.name))return false}return works(x,d,t)}
function slotState(d,t,dent){const now=new Date(),lim=new Date(now.getTime()+(C.minNotice||60)*60000);if(new Date(d+"T"+t+":00")<lim)return "past";const ch=C.chairs||2;
  for(let m=toMin(t);m<toMin(t)+STEP();m+=SUB()){const b=((C.busy||{})[d]||{})[fromMin(m).replace(":","")];if((b?b.n:0)+holdsAt(d,m)>=ch)return "busy"}
  const ds=C.dentists||[];if(dent){const x=ds.find(y=>y.name===dent);if(x&&!dentFree(x,d,t))return works(x,d,t)?"busy":"off";return "free"}
  if(ds.length&&!ds.some(x=>dentFree(x,d,t)))return ds.some(x=>works(x,d,t))?"busy":"off";return "free"}
function slotsFor(d){const o=toMin(C.open||"10:00"),c=toMin(C.close||"20:00"),st=STEP(),out=[];for(let m=o;m+st<=c;m+=st)out.push(fromMin(m));return out}
function freeCount(d,dent){return slotsFor(d).filter(t=>slotState(d,t,dent)==="free").length}
function render(){const dent=($("f-dent")||{}).value||"",days=openDays();if(!day||!days.includes(day)||!freeCount(day,dent))day=days.find(d=>freeCount(d,dent))||days[0]||"";
  const logo=C.logo?`<img src="${esc(C.logo)}" alt="">`:`<div class="ini">${esc((C.name||"D").split(/\s+/).filter(w=>/^[A-Za-z]/.test(w)&&!/^(dental|clinic|the)$/i.test(w)).slice(0,2).map(w=>w[0]).join("").toUpperCase()||"DC")}</div>`;
  const keep={n:($("f-name")||{}).value||"",p:($("f-phone")||{}).value||"",tr:($("f-tr")||{}).value||"",note:($("f-note")||{}).value||""};
  $("app").innerHTML=`<div class="hd">${logo}<div><h1>${esc(C.name||"Dental clinic")}</h1><p>${C.tagline?esc(C.tagline)+" · ":""}Book an appointment</p></div></div>
  ${C.msg?`<div class="msg">${esc(C.msg)}</div>`:""}
  <div class="card"><h2><span class="n">1</span>Choose a day</h2><div class="days" id="days">${days.map(d=>{const f=freeCount(d,dent),t=d===ymd(new Date())?"Today":d===addDays(ymd(new Date()),1)?"Tmrw":dName(d);return `<button type="button" class="day" data-day="${d}" aria-pressed="${d===day}" ${f?"":"disabled"}><small>${t}</small><b>${+d.slice(8)}</b><i>${f?f+" free":"Full"}</i></button>`}).join("")||`<p class="none">No days open for booking right now.</p>`}</div>
  ${C.pick!==false&&(C.dentists||[]).length?`<label for="f-dent" class="dent-lab">Dentist</label><select id="f-dent" class="dent-pick" required><option value=""${dent?"":" selected"} disabled>Choose Dentist</option>${C.dentists.map(x=>`<option value="${esc(x.name)}"${x.name===dent?" selected":""}>${esc(x.name)}${x.title?" · "+esc(x.title):""}</option>`).join("")}</select>${dent?(()=>{const x=C.dentists.find(y=>y.name===dent);return x&&x.days?`<p class="none" style="margin-top:6px">🕒 ${esc(dent)}: ${esc(x.days.slice().sort((a,b)=>a-b).map(v=>["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][v]).join(", "))} · ${fmtT(x.from)} – ${fmtT(x.to)}</p>`:""})():""}`:""}</div>
  <div class="card"><h2><span class="n">2</span>Choose a time${day?` · ${esc(dLong(day))}`:""}</h2>${day?(()=>{const ts=slotsFor(day).map(t=>[t,slotState(day,t,dent)]).filter(([,s])=>s!=="past"&&s!=="off");return ts.length?`<div class="times">${ts.map(([t,s])=>`<button type="button" class="tm" data-time="${t}" aria-pressed="${t===time}" ${s==="free"?"":"disabled"} aria-label="${fmtT(t)}${s==="free"?"":" booked"}">${fmtT(t)}</button>`).join("")}</div><div class="legend"><span>Free</span><span class="b">Already booked</span></div>`:`<p class="none">No times left on this day.</p>`})():""}</div>
  <div class="card"><h2><span class="n">3</span>Your details</h2>
  <label for="f-name">Patient's name</label><input id="f-name" autocomplete="name" maxlength="60" value="${esc(keep.n)}" placeholder="Full name">
  <label for="f-phone">Mobile number (WhatsApp)</label><input id="f-phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="16" value="${esc(keep.p)}" placeholder="03xx xxxxxxx">
  <label for="f-tr">What is it for?</label><select id="f-tr">${(C.treatments||[]).map(t=>`<option${t===keep.tr?" selected":""}>${esc(t)}</option>`).join("")}</select>
  <label for="f-note">Anything we should know? (optional)</label><textarea id="f-note" maxlength="200" placeholder="e.g. pain since 2 days, lower right side">${esc(keep.note)}</textarea>
  ${day&&time?`<div class="sum">📅 <span><b>${esc(dLong(day))}, ${fmtT(time)}</b></span></div>`:""}
  <p class="err" id="err" hidden></p>
  <button type="button" class="btn" id="go">Book appointment</button></div>
  <p class="ft">${C.phone?`Questions? Call or WhatsApp <a href="https://wa.me/${waNum(C.phone)}">${esc(C.phone)}</a><br>`:""}${C.address?esc(C.address):""}</p>`}
document.addEventListener("click",e=>{const d=e.target.closest("[data-day]");if(d&&!d.disabled){day=d.dataset.day;time="";render();setTimeout(()=>{const b=document.querySelector(".day[aria-pressed=true]");b&&b.scrollIntoView({inline:"center",block:"nearest"})},0);return}
  const t=e.target.closest("[data-time]");if(t&&!t.disabled){time=t.dataset.time;render();$("f-name").focus({preventScroll:true});return}
  if(e.target.closest("#go"))book();if(e.target.closest("#again")){time="";loadHolds().then(render)}});
document.addEventListener("change",e=>{if(e.target.id==="f-dent"){time="";render()}});
function err(m){const x=$("err");x.textContent=m;x.hidden=false}
async function book(){const name=$("f-name").value.trim().replace(/\s+/g," "),phone=$("f-phone").value.trim(),dent=($("f-dent")||{}).value||"";
  if($("f-dent")&&!dent){$("f-dent").focus();$("f-dent").scrollIntoView({block:"center",behavior:"smooth"});return err("Please choose a dentist.")}if(!day||!time)return err("Please choose a day and a time.");if(name.length<2)return err("Please write the patient's name.");if(!waNum(phone))return err("Please write a valid mobile number, e.g. 0300 1234567.");
  const b=$("go");b.disabled=true;b.textContent="Booking…";
  try{const fresh=await fs.collection("publicSlots").doc(code).get();if(fresh.exists)C=fresh.data();await loadHolds();
    if(slotState(day,time,dent)!=="free"){time="";render();err("Sorry, that time was just booked. Please choose another time.");return}
    const k=time.replace(":",""),b0=((C.busy||{})[day]||{})[k],start=(b0?b0.n:0)+holdsAt(day,toMin(time))+1;let hold="";
    for(let i=Math.max(1,start);i<=(C.chairs||2);i++){const id=`${day}_${k}_${i}`;try{await fs.collection("slotHolds").doc(code).collection("h").doc(id).set({date:day,time,at:new Date().toISOString()});hold=id;break}catch(x){}}
    if(!hold){await loadHolds();time="";render();err("Sorry, that time was just booked. Please choose another time.");return}
    await fs.collection("bookings").doc(code).collection("items").add({name,phone,date:day,time,treatment:$("f-tr").value,dentist:dent,note:$("f-note").value.trim().slice(0,200),hold,at:new Date().toISOString(),status:"new",src:document.referrer&&/instagram/i.test(document.referrer+navigator.userAgent)?"instagram":/FBAN|FBAV|facebook/i.test(navigator.userAgent+document.referrer)?"facebook":/instagram/i.test(navigator.userAgent)?"instagram":"web"});
    if(C.btopic){try{fetch("https://ntfy.sh/",{method:"POST",body:JSON.stringify({topic:C.btopic,title:"🌐 New online booking · "+(C.name||""),message:`${dLong(day)}, ${fmtT(time)} · ${$("f-tr").value}${dent?" · "+dent:""}. Open Dental Solutions to see who.`,priority:4,click:location.origin+location.pathname.replace(/book\.html$/,"")})}).catch(()=>{})}catch(x){}}
    const msg=`Assalam o Alaikum, I booked an appointment online.\nName: ${name}\nDay: ${dLong(day)}\nTime: ${fmtT(time)}\nFor: ${$("f-tr").value}`;
    $("app").innerHTML=`<div class="card ok"><div class="tick">✓</div><h2>Appointment booked</h2><p><b>${esc(dLong(day))}, ${fmtT(time)}</b><br>${esc(name)} · ${esc($("f-tr").value)}${dent?"<br>"+esc(dent):""}</p><p style="color:var(--muted);font-size:14px">${esc(C.name||"The clinic")} will confirm on WhatsApp. Please arrive 10 minutes early.</p>${C.phone?`<a class="btn wa" href="https://wa.me/${waNum(C.phone)}?text=${encodeURIComponent(msg)}">Send details on WhatsApp</a>`:""}<button type="button" class="btn ghost" onclick="location.reload()">Book another appointment</button></div>`;
  }catch(x){b.disabled=false;b.textContent="Book appointment";err("Couldn't book. Check your internet and try again.")}}
load();
})();
</script>
</body>
</html>
